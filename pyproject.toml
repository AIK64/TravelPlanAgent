[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-aware-travel-agent"
version = "0.4.0"
description = "A constraint-aware adaptive travel planning agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "pydantic>=2.9,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
llm-openai = [
    "openai>=2,<3",
]
llm-deepseek = [
    "openai>=2,<3",
]
checkpoint-sqlite = [
    "langgraph-checkpoint-sqlite>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["travel_agent"]
branch = true

